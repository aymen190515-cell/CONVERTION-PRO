[project]
name = "convertion-pro"
version = "0.1.0"
description = "Professional automotive instrument-cluster conversion platform"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=8"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
