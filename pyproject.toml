[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convertion-pro"
version = "0.1.0"
description = "Professional automotive instrument-cluster conversion platform"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
i2c = [
    "smbus2>=0.6.1,<1; sys_platform == 'linux'",
]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"convertion_pro.ui" = ["*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
